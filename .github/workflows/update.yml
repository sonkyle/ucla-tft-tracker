name: Update data & deploy site

on:
  schedule:
    # Every 15 minutes, on off-peak minutes: GitHub delays or drops scheduled runs most often at
    # :00/:15/:30/:45, when every other repo's cron fires. Runs can still start a few minutes late.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'config.json', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  # One job that checks, builds and publishes: a separate deploy job would wait ~6 s for a second machine.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      # Check out the branch as it is now, not the commit the run was triggered on. Runs wait their turn
      # (concurrency above), so by the time one starts, the run before it has usually pushed new data;
      # starting from the older commit made "Commit data" fail with a rebase conflict in the data files.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Poll Riot API
        if: github.event_name != 'push'
        run: node src/poll.js --max-matches 500
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Build site data
        run: node src/build.js

      # A deploy for a code change (push) didn't check Riot, so keep the live site's "Last updated" time
      # instead of the build's. If the live site can't be reached, the build's time is used.
      - name: Keep the last check time
        if: github.event_name == 'push'
        run: |
          # the query string skips GitHub Pages' CDN cache, which can lag a few minutes behind the last deploy
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/status.json?t=$(date +%s)"
          if curl -sfL -H 'Cache-Control: no-cache' "$url" -o /tmp/status.json && node -e "JSON.parse(require('fs').readFileSync('/tmp/status.json')).updatedAt > 0 || process.exit(1)"; then
            mv /tmp/status.json site/data/status.json
          fi

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update TFT data"
            # The branch can still move between checkout and here (a code push): try a few times.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase && git push; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != true ]; then echo "::error::Could not push the data commit"; exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Deployed after every check, even when nothing changed: the build stamps site/data/status.json
      # (not committed) with the time, which the site shows as "Last updated X minutes ago".
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Publishing the instant the upload finishes occasionally fails with "No artifacts named github-pages":
      # GitHub can take a moment to register the upload.
      - name: Wait for the upload to register
        run: sleep 5

      # GitHub Pages sometimes rejects or stalls a deploy through no fault of the site ("No artifacts named
      # github-pages", "in progress deployment", "Deployment failed, try again later"). Give up on a stalled
      # one after 3 minutes instead of the default 10, and try once more before failing the run.
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy site (second try)
        id: redeploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
