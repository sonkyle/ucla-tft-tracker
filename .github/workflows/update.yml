name: Update data & deploy site

on:
  schedule:
    # Every 15 minutes, on off-peak minutes: GitHub delays or drops scheduled runs most often at
    # :00/:15/:30/:45, when every other repo's cron fires. Runs can still start a few minutes late.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'config.json', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Poll Riot API
        if: github.event_name != 'push'
        run: node src/poll.js --max-matches 500
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Build site data
        run: node src/build.js

      # A deploy for a code change (push) didn't check Riot, so keep the live site's "Last updated" time
      # instead of the build's. If the live site can't be reached, the build's time is used.
      - name: Keep the last check time
        if: github.event_name == 'push'
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/status.json"
          if curl -sfL "$url" -o /tmp/status.json && node -e "JSON.parse(require('fs').readFileSync('/tmp/status.json')).updatedAt > 0 || process.exit(1)"; then
            mv /tmp/status.json site/data/status.json
          fi

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update TFT data"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Deployed after every check, even when nothing changed: the build stamps site/data/status.json
      # (not committed) with the time, which the site shows as "Last updated X minutes ago".
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
